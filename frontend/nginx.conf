server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ── React Router: send all non-file requests to index.html ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # NOTE: no /api/ proxy here — the app calls the backend directly via VITE_API_BASE_URL
    # (baked in at build time), which also means CORS on the backend must allow this
    # origin (FRONTEND_URL). A server-side proxy_pass to a "backend" host only resolves in
    # docker-compose's local network; on Railway (or any standalone deploy) that hostname
    # doesn't exist, and nginx refuses to start at all when an upstream can't resolve —
    # this crashed the container in production once before, so don't reintroduce it
    # without also making the upstream host configurable per-environment.

    # ── Compression ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}
