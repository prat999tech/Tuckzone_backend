# Production profile — active when SPRING_PROFILES_ACTIVE=prod
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/canteen}}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:canteen}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:canteen}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 50

  # Flyway reuses the primary DataSource bean (from DatabaseConfig) automatically
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  payment:
    # Stated explicitly here (not inherited) so the mock-money switch is always a
    # conscious deployment decision. Set APP_ALLOW_MOCK_TOPUP=false once the real
    # payment gateway is wired up.
    allow-mock-topup: ${APP_ALLOW_MOCK_TOPUP:true}
