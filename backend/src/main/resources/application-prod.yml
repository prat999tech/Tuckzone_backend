# Production profile — active when SPRING_PROFILES_ACTIVE=prod
spring:
  datasource:
    # Render gives DATABASE_URL as postgresql://... but JDBC needs jdbc:postgresql://
    # We read JDBC_DATABASE_URL which the user sets manually with jdbc: prefix
    # OR Spring Boot auto-maps SPRING_DATASOURCE_URL env var directly
    url: ${JDBC_DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    url: ${JDBC_DATABASE_URL}

server:
  port: ${PORT:8080}
